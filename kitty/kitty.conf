# --- FONT SETTINGS ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# --- 日本語フォントのフォールバック ---
# 英字フォントに含まれない日本語をどのフォントで補うか指定
symbol_map U+4E00-U+9FFF,U+3040-U+309F,U+30A0-U+30FF M PLUS 1

# --- ウィンドウ・背景の設定 ---
# 背景の透明度（0.0 〜 1.0）。壁紙を透かしたいなら0.8くらいがおすすめ
background_opacity 0.5
cursor_trail 1

# ウィンドウの余白（少し空けると見た目がスッキリする）
window_padding_width 4

# --- カーソルの設定 ---
# カーソルの形（block, beam, underline）
cursor_shape beam
# カーソルの点滅を止める場合は 0
cursor_blink_interval 0

# --- その他 ---
# ベル音を鳴らさない（うるさい時に）
enable_audio_bell no
include ~/.config/kitty/colors.conf
